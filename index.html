function myCard(e){const labels={open:'已報名',closed:'報名已截止',ended:'活動已結束'};const actions={open:[['修改報名資料','edit'],['取消報名','cancel']],closed:[['查看報名資料','view'],['取消報名','cancel']],ended:[['查看出席紀錄','attendance']]};return `<article class="my-card"><img src="${e.image}" alt="${esc(e.name)}活動海報"><div><h2 class="my-title">${esc(e.name)}</h2><div class="my-desc">${esc(e.description.replaceAll('\\n','\n'))}</div></div><div class="my-side"><div class="my-meta"><span class="sym">▦</span>${esc(e.date)}</div><div class="my-meta"><span class="sym">⌖</span>${esc(e.location)}</div><span class="my-badge ${e.status}">${labels[e.status]}</span><div class="my-actions">${actions[e.status].map(([label,action])=>`<button class="${action==='cancel'?'secondary':''} ${action==='edit'?'my-action-edit':''}" data-act="${action}" data-id="${e.id}">${action==='view'?'查看<span class="my-action-highlight">報名資料</span>':action==='attendance'?'查看<span class="my-action-highlight-attendance">出席紀錄</span>':label}</button>`).join('')}</div></div></article>`}
function renderMy(){const c=document.getElementById('content');let list=registered.filter(e=>e.name.includes(myQuery)&&(myStatus==='all'||e.status===myStatus));if(myFrom)list=list.filter(e=>e.date.slice(0,10)>=myFrom);if(myTo)list=list.filter(e=>e.date.slice(0,10)<=myTo);c.innerHTML=`<h1 class="heading">我參加的活動</h1><div class="notice">以下三筆活動為互動原型示範，分別模擬「報名中」、「報名已截止」、「活動已結束」，並非正式報名紀錄。</div><div class="my-filters"><input class="q" id="mySearch" placeholder="搜尋活動" value="${esc(myQuery)}"><input class="date" id="myFrom" type="date" aria-label="開始日期" value="${myFrom}"><input class="date" id="myTo" type="date" aria-label="結束日期" value="${myTo}"><select id="myStatus" aria-label="活動狀態"><option value="all">活動狀態：全部</option><option value="open">報名中</option><option value="closed">報名已截止</option><option value="ended">活動已結束</option></select><button id="mySearchBtn">搜尋</button></div><div class="my-list">${list.length?list.map(myCard).join(''):'<div class="my-empty">沒有符合條件的活動</div>'}</div>`;c.querySelector('#myStatus').value=myStatus;const apply=()=>{myQuery=c.querySelector('#mySearch').value.trim();myStatus=c.querySelector('#myStatus').value;myFrom=c.querySelector('#myFrom').value;myTo=c.querySelector('#myTo').value;renderMy()};c.querySelector('#mySearchBtn').onclick=apply;c.querySelector('#mySearch').onkeydown=e=>{if(e.key==='Enter')apply()};c.querySelector('#myStatus').onchange=apply;c.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>showMyAction(b.dataset.act,registered.find(e=>e.id===b.dataset.id)))}
function showMyAction(action,e){if(action==='edit'){showEditRegistrations(e);return;}const titles={edit:'修改報名資料',view:'查看報名資料',cancel:'取消報名',attendance:'查看出席紀錄'};const messages={edit:'此處將串接原系統的「修改報名資料」頁面。',view:'此處將串接原系統的唯讀報名資料頁面。',cancel:'正式系統應在這裡要求使用者再次確認取消報名；本模擬不會取消任何資料。',attendance:'此處將串接原系統的個人出席紀錄頁面。'};let div=document.createElement('div');div.className='modal-overlay';div.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${titles[action]}"><h2>${titles[action]}</h2><p><strong>${esc(e.name)}</strong></p><p>${messages[action]}</p><div class="modal-actions"><button id="closeModal">返回</button></div></div>`;document.body.appendChild(div);div.querySelector('#closeModal').onclick=()=>div.remove();div.onclick=ev=>{if(ev.target===div)div.remove()};}

 c.innerHTML=`<h1 class="heading">報名作業管理</h1><p class="ops-info">管理所有活動的報名情況和參與者資訊</p><div class="notice">此頁為操作模擬，活動人數及狀態依照先前示意圖呈現，不代表即時系統資料；按鈕不會更動正式報名資料。</div><div class="ops-filter"><input id="opsSearch" class="ops-key" placeholder="搜尋活動名稱" value="${esc(opsSearch)}"><input id="opsFrom" class="ops-date" type="date" aria-label="開始日期" value="${opsFrom}"><span>至</span><input id="opsTo" class="ops-date" type="date" aria-label="結束日期" value="${opsTo}"><select id="opsState" aria-label="活動狀態"><option value="all">活動狀態：全部</option><option value="報名中">報名中</option><option value="報名已截止">報名已截止</option></select><button id="opsFind">搜尋</button><button id="opsReset" class="reset">重置</button></div><div class="ops-list">${filtered.length?filtered.map(e=>`<article class="ops-row"><div class="ops-name-wrap"><div class="ops-name">${esc(e.name)}<span class="ops-state ${e.state==='報名中'?'':'closed'}">${e.state}</span></div><div class="ops-sub">已有 ${e.count} 人報名 · 截止時間：${esc(e.deadline)}</div></div><div class="ops-count"><small>已報名</small><strong>${e.count}</strong>人</div><div class="ops-deadline"><small>截止時間</small>${esc(e.deadline.slice(0,10))}<div style="font-size:14px">${esc(e.deadline.slice(11))}</div></div><div class="ops-actions">${opsButtons.map(([label,color])=>`<button style="background:${color}" data-ops="${label}" data-opevent="${e.id}">${label}</button>`).join('')}</div></article>`).join(''):'<div class="my-empty">沒有符合條件的活動</div>'}</div>`;
 c.querySelector('#opsState').value=opsState;
 const apply=()=>{opsSearch=c.querySelector('#opsSearch').value.trim();opsFrom=c.querySelector('#opsFrom').value;opsTo=c.querySelector('#opsTo').value;opsState=c.querySelector('#opsState').value;renderOps()};
 c.querySelector('#opsFind').onclick=apply;c.querySelector('#opsSearch').onkeydown=e=>{if(e.key==='Enter')apply()};c.querySelector('#opsState').onchange=apply;c.querySelector('#opsReset').onclick=()=>{opsSearch='';opsFrom='';opsTo='';opsState='all';renderOps()};
 c.querySelectorAll('[data-ops]').forEach(b=>b.onclick=()=>showOpsAction(b.dataset.ops,opsEvents.find(e=>e.id===b.dataset.opevent)));
}
function showOpsAction(action,e){
 if(action==='修改報名資料'){showEditRegistrations(e);return;}
 if(action==='後台報名'){showBackend(e);return;}
 if(action==='寄發通知'){showMailComposer(e);return;}if(action==='查詢通知紀錄'){showMailHistory(e);return;}
 const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>${esc(action)}</h2><p><strong>${esc(e.name)}</strong></p><p>此為原系統「${esc(action)}」功能的模擬入口，尚未連接正式資料。</p><div class="modal-actions"><button data-close>返回報名作業管理</button></div></div>`;document.body.appendChild(overlay);overlay.querySelector('[data-close]').onclick=()=>overlay.remove();overlay.onclick=ev=>{if(ev.target===overlay)overlay.remove()};
}

function showEditRegistrations(event){

 const safe=(v)=>esc(String(v));
 function renderTable(){
  const rows=filtered(),start=(pageNo-1)*pageSize,shown=rows.slice(start,start+pageSize),totalPages=Math.max(1,Math.ceil(rows.length/pageSize));

  <div class="edit-reg-filter"><input id="regKeyword" placeholder="⌕  搜尋法師法號" value="${safe(keyword)}"><select id="regStatus" aria-label="審核狀態"><option value="all">審核狀態</option><option value="已駁回">已駁回</option><option value="已錄取">已錄取</option></select><button class="search" id="regSearch">⌕ 搜尋</button><button class="reset" id="regReset">重置</button></div>
  <div class="edit-reg-table-wrap"><table class="edit-reg-table"><thead><tr><th></th><th>法號</th><th>郵箱</th><th>報名時間</th><th>狀態</th><th>操作</th></tr></thead><tbody>${shown.length?shown.map((r,i)=>`<tr><td><input type="checkbox" aria-label="選取${safe(r.name)}"></td><td><div class="edit-reg-person"><span class="edit-reg-avatar">●</span>${safe(r.name)}</div></td><td>${safe(r.email)}</td><td>${safe(r.date)}</td><td><span class="edit-reg-status">${safe(r.status)}</span></td><td><div class="edit-reg-actions"><button class="detail" data-action="查看詳情" data-index="${start+i}">查看詳情</button><button class="modify" data-action="修改報名資料" data-index="${start+i}">修改報名資料</button><button class="cancel" data-action="取消報名" data-index="${start+i}">取消報名</button></div></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:35px">沒有符合條件的報名資料</td></tr>'}</tbody></table></div>
  <div class="edit-reg-footer"><span>共 ${rows.length} 項</span><select id="regSize"><option value="10">10項/頁</option><option value="20">20項/頁</option><option value="50">50項/頁</option></select><button id="regPrev" aria-label="上一頁">‹</button><span style="color:#2688fa">${pageNo}</span><button id="regNext" aria-label="下一頁">›</button><span>前往</span><input id="regGo" type="number" min="1" max="${totalPages}" value="${pageNo}"><span>頁</span></div>
  <p class="edit-reg-hint">模擬活動：${safe(event.name)}。人員與 Email 為示意資料，不連接正式報名系統。</p></div>`;
  overlay.querySelector('#regStatus').value=status;overlay.querySelector('#regSize').value=String(pageSize);
  overlay.querySelector('.edit-close').onclick=()=>overlay.remove();
  const apply=()=>{keyword=overlay.querySelector('#regKeyword').value.trim();status=overlay.querySelector('#regStatus').value;pageNo=1;renderTable()};
  overlay.querySelector('#regSearch').onclick=apply;overlay.querySelector('#regKeyword').onkeydown=e=>{if(e.key==='Enter')apply()};
  overlay.querySelector('#regReset').onclick=()=>{keyword='';status='all';pageNo=1;renderTable()};
  overlay.querySelector('#regSize').onchange=e=>{pageSize=Number(e.target.value);pageNo=1;renderTable()};
  overlay.querySelector('#regPrev').onclick=()=>{if(pageNo>1){pageNo--;renderTable()}};
  overlay.querySelector('#regNext').onclick=()=>{if(pageNo<totalPages){pageNo++;renderTable()}};
  overlay.querySelector('#regGo').onchange=e=>{pageNo=Math.max(1,Math.min(totalPages,Number(e.target.value)||1));renderTable()};
  overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
    const r=rows[Number(b.dataset.index)];const action=b.dataset.action;
    const dialog=document.createElement('div');dialog.className='modal-overlay';
    dialog.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>${safe(action)}</h2><p>法號：${safe(r.name)}<br>郵箱：${safe(r.email)}<br>報名時間：${safe(r.date)}<br>狀態：${safe(r.status)}</p><p>${action==='查看詳情'?'此處為原系統「查看詳情」的模擬入口。':action==='修改報名資料'?'此處為原系統「修改報名資料」的模擬入口，尚未提供編輯表單。':'此處為原系統「取消報名」的模擬入口，不會真的取消。'}</p><div class="modal-actions"><button data-close>返回名單</button></div></div>`;
    document.body.appendChild(dialog);dialog.querySelector('[data-close]').onclick=()=>dialog.remove();dialog.onclick=e=>{if(e.target===dialog)dialog.remove()};
  });
 }
 document.body.appendChild(overlay);renderTable();
 overlay.addEventListener('click',ev=>{if(ev.target===overlay)overlay.remove()});
 overlay.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.stopPropagation();overlay.remove()}});
 overlay.querySelector('.edit-close').focus();
}

function showBackend(e){
 const overlay=document.createElement('div');overlay.className='modal-overlay';document.body.appendChild(overlay);
 let section='home',mode='single',search='',uploaded=[];
 const close=()=>overlay.remove();
 function layout(body){overlay.innerHTML=`<section class="backend-panel" role="dialog" aria-modal="true" aria-label="後台報名"><div class="backend-head"><div><h2>後台報名</h2><p>${esc(e.name)}</p></div><button class="backend-close" id="backendClose" aria-label="關閉">×</button></div>${body}<p class="backend-note">本頁為互動模擬，所有名單、電子郵件及操作結果均為示意，不會寫入正式系統。</p></section>`;overlay.querySelector('#backendClose').onclick=close;overlay.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{section='home';render()})}

 }
 function showBackendNotice(action,name){const note=document.createElement('div');note.className='modal-overlay';note.style.zIndex='120';note.innerHTML=`<div class="modal"><h2>${esc(action)}</h2><p>${esc(name)}</p><p>此為原系統功能的模擬入口，尚未連接真實資料。</p><button class="backend-btn" data-close>關閉</button></div>`;document.body.appendChild(note);note.querySelector('[data-close]').onclick=()=>note.remove();note.onclick=ev=>{if(ev.target===note)note.remove()}}

 function saveInputs(){if(state.step!=='compose')return;const g=id=>overlay.querySelector('#'+id);if(!g('mailSubject'))return;state.subject=g('mailSubject').value;state.body=g('mailBody').value;state.sender=g('mailSender').value;state.saveAs=g('mailSaveAs').checked;}

 <section class="mail-step"><h3>③ 附件與儲存範本</h3><div class="mail-row"><label class="mail-btn secondary" for="mailFile">＋ 加入附件</label><input id="mailFile" type="file" multiple style="display:none"><span class="mail-note">例如：活動簡章、行前功課（僅在此頁顯示檔名，不會上傳）</span></div><div class="mail-attachments" id="mailFiles"></div><label style="display:flex;align-items:center;gap:9px;margin-top:12px"><input type="checkbox" id="mailSaveAs" ${state.saveAs?'checked':''}>將此次郵件內容存成自訂範本，下次活動可再套用</label><div id="mailSaveControls" ${state.saveAs?'':'hidden'} class="mail-row" style="margin-top:12px"><div class="mail-field" style="max-width:380px"><label for="mailNewTemplateName">範本名稱</label><input id="mailNewTemplateName" placeholder="例如：禪修營行前通知"></div><button class="mail-btn secondary" id="mailSaveTemplate">儲存範本</button></div></section><div class="mail-footer"><span class="mail-note">此為互動模擬，不會寄送郵件或儲存至正式系統。</span><div class="mail-row"><button class="mail-btn secondary" id="mailCancel">取消</button><button class="mail-btn" id="mailPreview">預覽收件名單與郵件 →</button></div></div>`);
 overlay.querySelector('#mailSender').value=state.sender;
 function updatePeople(){const list=recipients();overlay.querySelector('#mailPeopleSummary').textContent=`目前符合條件：${list.length} 位（示意資料；正式系統應依活動報名名單即時計算）`;const body=overlay.querySelector('#mailPeopleRows');if(!body)return;const visible=candidates().filter(p=>p.name.includes(state.keyword)||p.email.includes(state.keyword));body.innerHTML=visible.length?visible.map(p=>`<tr><td><input type="checkbox" data-mail-id="${p.id}" ${state.selected.has(p.id)?'checked':''}></td><td>${safe(p.name)}</td><td>${safe(p.kind)}</td><td>${safe(p.status)}</td><td>${safe(p.email)}</td></tr>`).join(''):'<tr><td colspan="5">沒有符合條件的示意資料</td></tr>';body.querySelectorAll('[data-mail-id]').forEach(el=>el.onchange=()=>{if(el.checked)state.selected.add(Number(el.dataset.mailId));else state.selected.delete(Number(el.dataset.mailId));updatePeople()});}

 overlay.querySelector('#mailKeyword').oninput=el=>{state.keyword=el.target.value;updatePeople()};overlay.querySelector('#mailSelectVisible').onclick=()=>{candidates().filter(p=>p.name.includes(state.keyword)||p.email.includes(state.keyword)).forEach(p=>state.selected.add(p.id));updatePeople()};overlay.querySelector('#mailClearSelected').onclick=()=>{state.selected.clear();updatePeople()};
 overlay.querySelector('#mailApply').onclick=()=>{saveInputs();applyTemplate(overlay.querySelector('#mailTemplate').value);render()};overlay.querySelector('#mailNew').onclick=()=>{saveInputs();state.template='';state.subject='';state.body='';render()};overlay.querySelector('#mailDelete').onclick=()=>{const name=overlay.querySelector('#mailTemplate').value;if(!mailSavedTemplates[name]){alert('系統預設範本不能刪除；只能刪除自訂範本。');return;}delete mailSavedTemplates[name];state.template='活動行前通知';applyTemplate(state.template);render()};

function mailAddSimulatedHistory(event,people,state){
 const now=new Date();const stamp=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
 const rec={id:'demo-'+now.getTime()+'-'+Math.random().toString(36).slice(2,6),eventId:event.id,eventName:event.name,time:stamp,subject:state.subject,sender:state.sender,template:state.template||'自訂內容',body:state.body,recipients:people.map(p=>({id:p.id,name:p.name,email:p.email})),status:'模擬寄送（未實際寄出）'};
 mailHistory.unshift(rec);try{localStorage.setItem(mailHistoryStorageKey,JSON.stringify(mailHistory));}catch(_){}
}

 c.querySelectorAll('[data-fm-del-location]').forEach(e=>e.onclick=()=>{const i=+e.dataset.fmDelLocation;if(fm.sessions.some(s=>s.place===i)){alert('這個地點已有場次使用。請先移動或刪除相關場次，再刪除地點。');return;}if(!confirm('確定刪除此活動地點？'))return;fm.locations.splice(i,1);fm.sessions.forEach(s=>{if(s.place>i)s.place--});fm.travel=fm.travel.filter(t=>t.from!==i&&t.to!==i).map(t=>({...t,from:t.from>i?t.from-1:t.from,to:t.to>i?t.to-1:t.to}));renderFormManagement()});
 const shared=c.querySelector('#fmSharedDay');if(shared)shared.onchange=()=>{fm.sharedDay=shared.value;fm.sessions.forEach(s=>{s.start=shared.value+s.start.slice(10);s.end=shared.value+s.end.slice(10)});renderFormManagement()};
 c.querySelectorAll('[data-session]').forEach(row=>row.querySelectorAll('[data-key]').forEach(el=>el.onchange=()=>{const ss=fm.sessions.find(x=>x.id===+row.dataset.session);let val=el.value;if(fm.type==='2'&&(el.dataset.key==='start'||el.dataset.key==='end'))val=(fm.sharedDay||ss.start.slice(0,10))+'T'+val;ss[el.dataset.key]=['place','capacity'].includes(el.dataset.key)?Number(val):val}));
 c.querySelectorAll('[data-fm-remove]').forEach(e=>e.onclick=()=>{fm.sessions=fm.sessions.filter(s=>s.id!==+e.dataset.fmRemove);fm.selected=fm.selected.filter(id=>id!==+e.dataset.fmRemove);renderFormManagement()});
 if(fm.type==='3'){const co=fm.course;c.querySelectorAll('[name=fmCourseMode]').forEach(e=>e.onchange=()=>{co.mode=e.value;renderFormManagement()});c.querySelectorAll('[data-fm-course]').forEach(e=>e.onchange=()=>{const k=e.dataset.fmCourse;if(k==='location')fm.locations[0]=e.value;else if(k==='capacity')fm.sessions[0].capacity=Number(e.value);else if(k==='paused')co.paused=e.value.split(/[,\n]/).map(v=>v.trim()).filter(Boolean);else co[k]=e.value;renderFormManagement()});c.querySelectorAll('[data-course-weekday]').forEach(e=>e.onchange=()=>{const n=+e.dataset.courseWeekday;co.days=e.checked?[...new Set([...co.days,n])]:co.days.filter(x=>x!==n);renderFormManagement()});c.querySelectorAll('[data-course-remove]').forEach(e=>e.onchange=()=>{co.manual=co.manual.filter(x=>x!==e.dataset.courseRemove);renderFormManagement()});}
}
if(fm.step===2){c.querySelectorAll('[data-fm-travel]').forEach(e=>e.onchange=()=>fmSetTravel(e.dataset.fmTravel,'minutes',Math.max(0,Number(e.value)||0)));c.querySelectorAll('[data-fm-ask]').forEach(e=>e.onchange=()=>fmSetTravel(e.dataset.fmAsk,'ask',e.checked))}
if(fm.step===3){
 c.querySelectorAll('[data-fm-module]').forEach(e=>e.onchange=()=>{fm.enabled[e.dataset.fmModule]=e.checked});
 c.querySelectorAll('[data-fm-expand]').forEach(e=>e.onclick=()=>{fm.questionOpen=fm.questionOpen===e.dataset.fmExpand?'':e.dataset.fmExpand;renderFormManagement()});
 c.querySelectorAll('[data-fm-addq]').forEach(e=>e.onclick=()=>{const id='fq'+Date.now()+'_'+Math.floor(Math.random()*10000);fm.questions[e.dataset.fmAddq].push({id,title:'新題目',type:'text',options:'',required:false,condition:'always',answer:'',depends:'',session:''});renderFormManagement()});
 c.querySelectorAll('[data-fm-delq]').forEach(e=>e.addEventListener('click',event=>{
  event.preventDefault();event.stopPropagation();
  const id=e.getAttribute('data-fm-delq');
  const group=Object.keys(fm.questions).find(k=>Array.isArray(fm.questions[k])&&fm.questions[k].some(q=>String(q.id)===id));
  if(!group){alert('找不到這道題目，請重新開啟題目設定。');return;}
  const q=fm.questions[group].find(q=>String(q.id)===id);
  if(!window.confirm('確定刪除「'+(q.title||'未命名題目')+'」？'))return;
  fm.questions[group]=fm.questions[group].filter(q=>String(q.id)!==id);
  // Clear dependencies that pointed at the removed question.
  Object.values(fm.questions).flat().forEach(q=>{if(String(q.depends)===id)q.depends='';});
  renderFormManagement();
}));
 c.querySelectorAll('[data-fm-question]').forEach(row=>row.querySelectorAll('[data-q-field]').forEach(el=>{const update=()=>{const q=Object.values(fm.questions).flat().find(q=>q.id===row.dataset.fmQuestion);if(!q)return;q[el.dataset.qField]=el.dataset.qField==='required'?el.checked:el.value;if(el.dataset.qField==='type'){const wrap=row.querySelector('[data-q-options-wrap]');if(wrap)wrap.style.display=['radio','checkbox','select'].includes(q.type)?'':'none'}};el.addEventListener(el.tagName==='INPUT'&&el.type==='text'||el.tagName==='TEXTAREA'?'input':'change',update)}));
}
if(fm.step===4){c.querySelectorAll('[data-fm-pick]').forEach(e=>e.onchange=()=>{const id=+e.dataset.fmPick;if(e.checked){const s=fm.sessions.find(x=>x.id===id);if(fm.selected.some(x=>fmOverlap(s,fm.sessions.find(y=>y.id===x)))){alert('這個場次與已選場次時間重疊，同一時段只能在一個地點。');renderFormManagement();return}fm.selected.push(id)}else fm.selected=fm.selected.filter(x=>x!==id);renderFormManagement()});c.querySelectorAll('[data-fm-answer]').forEach(el=>{const update=()=>{const id=el.dataset.fmAnswer;if(el.type==='checkbox'){const vals=[...c.querySelectorAll('input[type=checkbox][data-fm-answer="'+id+'"]:checked')].map(x=>x.value);fm.answers[id]=vals.join('|')}else fm.answers[id]=el.value;if(el.type==='radio'||el.tagName==='SELECT')renderFormManagement()};el.addEventListener(el.type==='radio'||el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',update)})}
}
function fmQ(title,desc){return `<div class="fm-q"><strong>${fmh(title)}</strong><div class="fm-muted">${fmh(desc)}</div></div>`}
function fmSetTravel(key,field,value){const [from,to]=key.split('-').map(Number);let t=fm.travel.find(x=>x.from===from&&x.to===to);if(!t){t={from,to,minutes:0,ask:false};fm.travel.push(t)}t[field]=value}
function fmGo(step){fm.step=step;renderFormManagement();document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'})}
function fmAction(action){if(action==='next')fmGo(Math.min(5,fm.step+1));else if(action==='prev')fmGo(Math.max(0,fm.step-1));else if(action==='go3')fmGo(3);else if(action==='go4')fmGo(4);else if(action==='previewSubmit')fmValidatePreview();else if(action==='addLocation'){if(fmIsSingle())return;fm.locations.push('新地點 '+(fm.locations.length+1));renderFormManagement()}else if(action==='addSession'){if(fmIsSingle()||fm.type==='3')return;const d=fm.sharedDay||'2027-06-01';fm.sessions.push({id:Math.max(0,...fm.sessions.map(s=>s.id))+1,place:0,name:fm.type==='2'?'新場次':'新梯次',start:fm.type==='2'?d+'T09:00':'2027-06-27T09:00',end:fm.type==='2'?d+'T11:00':'2027-06-27T17:00',capacity:30});renderFormManagement()}else if(action==='addCourseDay'){const el=document.querySelector('#fmManualDate'),v=el?.value;if(v&&!fm.course.manual.includes(v))fm.course.manual.push(v);renderFormManagement()}else if(action==='draft'){const e=document.querySelector('#fmSaveResult');if(e)e.textContent='已完成模擬草稿操作（僅在目前頁面記憶體中保留；重新整理後不保留）。'}}
function fmCountCombos(){const n=fm.sessions.length,k=Math.min(n,16),total=Math.pow(2,k)-1;let valid=0;for(let mask=1;mask<=total;mask++){const arr=[];for(let i=0;i<k;i++)if(mask&(1<<i))arr.push(fm.sessions[i]);let ok=true;for(let i=0;i<arr.length&&ok;i++)for(let j=i+1;j<arr.length;j++)if(fmOverlap(arr[i],arr[j])){ok=false;break}if(ok)valid++}return {total,valid,limited:n>16}}


/* V23 結夏範本擴充：套用後為活動獨立副本 */
const summerTemplates={
 identity:[['戒別','radio','比丘\n比丘尼\n沙彌\n沙彌尼\n男眾行者\n女眾行者',true,'always']],
 practice:[['個人用功情況','textarea','',false,'selected'],['修學禪法的心得，在生活中如何運用？','textarea','',false,'selected']],
 health:[['身體狀況','textarea','',false,'selected'],['是否用藥石？','radio','是\n否',true,'selected']],
 other:[['其他','textarea','',false,'selected'],['是否願意擔任這次結夏期間的內、外護工作？','radio','願意擔任內護\n願意擔任外護\n都可以\n暫時無法',true,'selected']],
 placeA:[['是否需要提前掛單或延長掛單？（總本山）','checkbox','提前掛單\n延長掛單\n都不需要',true,'placeA']],
 placeB:[['是否需要提前掛單或延長掛單？（紫雲寺）','checkbox','提前掛單\n延長掛單\n都不需要',true,'placeB']],
 transfer:[['是否需要交通協助？','radio','需要\n自行安排',true,'transfer']],
 airport:[['是否需要機場接送？','radio','需要\n不需要',false,'selected'],['航班資訊（需要接送時填寫）','textarea','',false,'answer','需要']]
};
const fmSummer={applied:false,origin:'mountain',unit:'總本山',memberUnit:'總本山',site:'ziyun',needRide:'yes',airport:'yes',routes:{},early:'no',late:'no'};
function fmApplySummer(){
 let n=0;fm.questions={};Object.entries(summerTemplates).forEach(([k,rows])=>fm.questions[k]=rows.map(([title,type,options,required,condition,answer])=>({id:'summer_'+(++n),title,type,options,required,condition,answer:answer||'',session:'',depends:''})));
 Object.keys(fm.enabled).forEach(k=>fm.enabled[k]=true);fmSummer.applied=true;fm.questionOpen='identity';renderFormManagement();
}
function fmSummerSetup(){return `<div class="fm-note" style="margin-bottom:15px"><strong>快速套用結夏報名表範本</strong><p style="margin:8px 0">7 組固定題目＋掛單、交通條件題。套用後仍可逐題修改，且不影響其他活動。</p><button type="button" class="fm-btn" id="summerApply">${fmSummer.applied?'重新套用標準範本':'套用結夏標準範本'}</button>${fmSummer.applied?'<span class="fm-mini" style="margin-left:12px;color:#23734c">✓ 已套用（此活動獨立副本）</span>':''}</div><div class="fm-note" style="background:#f4f8fc"><strong>題目分組說明</strong><p>固定題目：戒別、個人用功、修學心得、身體狀況、藥石、其他、內外護意願。</p><p>條件題目：提前／延長掛單、交通路線、機場接送與航班資料。</p><p>請往下展開各區塊，修改題目文字、選項或必填設定。</p></div>`}
const _fmQuestionStepV22=fmQuestionStep;
fmQuestionStep=function(){return _fmQuestionStepV22().replace('<p class="fm-muted">先選擇',fmSummerSetup()+'<p class="fm-muted">先選擇')};
function fmSummerPreview(){
 const origin=fmSummer.origin,site=fmSummer.site;
 const places=fm.sessions.filter(x=>fm.selected.includes(x.id)).map(x=>fm.locations[x.place]);
 const hasMountain=places.some(x=>x.includes('總本山')),hasZiyun=places.some(x=>x.includes('紫雲'));
 let route=[];
 if(origin==='mountain'&&hasZiyun)route=['總本山 → 南港','南港 → 左營','左營 → 紫雲寺'];
 else if(origin==='branch'&&hasMountain)route=['所在分院 → 總本山（依分院位置確認路線）'];
 else if(origin==='branch'&&hasZiyun)route=['所在分院 → 紫雲寺（可自行前往）'];
 else if(origin==='overseas')route=['抵達機場 → 參加地點'];
 if(hasMountain&&hasZiyun)route.push('總本山 ↔ 紫雲寺（不同梯次之間）');
 const select=(name,opts,val)=>`<select data-summer="${name}" style="width:100%;padding:10px;border:1px solid #cbd5df;border-radius:8px">${opts.map(([v,t])=>`<option value="${v}" ${v===val?'selected':''}>${t}</option>`).join('')}</select>`;
 return `<section class="fm-preview-section" id="summerPreview"><h3>二、確認目前所在單位</h3><p class="fm-muted">會員資料顯示的所在單位：<strong>${fmh(fmSummer.memberUnit)}</strong>（示範資料）。若人事已有調動，請依實際情況修改。本次確認資料不會更動會員主檔。</p><div class="fm-grid"><div class="fm-field"><label>請確認您目前的所在類別</label>${select('origin',[['mountain','總本山法師'],['branch','分院法師'],['overseas','海外法師']],origin)}</div><div class="fm-field"><label>目前所在單位／地區</label><input data-summer="unit" value="${fmh(fmSummer.unit)}" placeholder="請填寫目前所在單位"></div></div><h3>三、掛單訊息</h3><p class="fm-muted">依所選梯次與地點，詢問是否需要提前掛單或延長掛單。</p>${!places.length?'<div class="fm-note">請先在上方勾選參加梯次。</div>':`<div class="fm-grid">${[...new Set(places)].map(p=>`<div class="fm-field"><label>${fmh(p)}｜掛單需求</label><label class="fm-check"><input type="checkbox">需要提前掛單</label><label class="fm-check"><input type="checkbox">需要延長掛單</label></div>`).join('')}</div>`}<h3>四、交通安排</h3>${origin==='mountain'&&hasMountain&&!hasZiyun?'<div class="fm-note">總本山法師僅參加總本山場次：不需要填寫一般交通問題。</div>':!places.length?'<p class="fm-muted">請先選擇梯次以顯示交通問題。</p>':`<p class="fm-muted">依目前所在單位及參加地點，建議詢問以下路段。是否需要接駁，由法師自行勾選。</p>${route.map(r=>`<div class="fm-field" style="margin:8px 0"><label>${fmh(r)}</label>${select('route_'+r,[['self','自行安排'],['need','需要協助'],['none','不適用']],fmSummer.routes[r]||'self')}</div>`).join('')}`}${origin==='overseas'?`<div class="fm-field"><label>是否需要機場接送？</label>${select('airport',[['yes','需要'],['no','不需要']],fmSummer.airport)}</div>${fmSummer.airport==='yes'?`<div class="fm-grid"><div class="fm-field"><label>抵達機場</label><input placeholder="例如：桃園國際機場"></div><div class="fm-field"><label>抵達航班編號</label><input placeholder="例如：BR... "></div><div class="fm-field"><label>抵達日期與時間</label><input type="datetime-local"></div><div class="fm-field"><label>回程航班及日期時間</label><input placeholder="請填寫回程資訊"></div></div>`:''}`:''}<div class="fm-note" style="margin-top:14px">此區為條件式報名流程示範。正式版本需由承辦人設定各年接駁路線、提前掛單日期與場次銜接規則。</div></section>`;
}
const _fmPreviewStepV22=fmPreviewStep;
fmPreviewStep=function(){let html=_fmPreviewStepV22();const anchor='<div class="fm-row" style="justify-content:flex-end">';const idx=html.lastIndexOf(anchor);return idx<0?html:html.slice(0,idx)+fmSummerPreview()+html.slice(idx)};
const _renderFormManagementV22=renderFormManagement;
renderFormManagement=function(){_renderFormManagementV22();const c=document.getElementById('content');if(!c)return;
 const apply=c.querySelector('#summerApply');if(apply)apply.onclick=()=>{if(fmSummer.applied&&!confirm('重新套用會取代目前已修改的題目，確定繼續？'))return;fmApplySummer()};
 c.querySelectorAll('[data-summer]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.summer;if(k.startsWith('route_'))fmSummer.routes[k.slice(6)]=el.value;else fmSummer[k]=el.value;if(k==='origin'){fmSummer.unit={mountain:'總本山',branch:'',overseas:''}[el.value]}if(['origin','airport'].includes(k))renderFormManagement()}));
};
